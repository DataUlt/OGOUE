    <script type="module">
        import { createAgent, listAgents, deleteAgent, copyAccessCode } from './js/agents-management.js';

        // Le prénom de l'agent est saisi par le gérant et réinjecté ici
        // dans du HTML : sans échappement, « <img onerror=…> » s'exécute
        // à chaque ouverture de la page, pour lui comme pour ses agents.
        function echapperHtml(valeur) {
            return String(valeur ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        // Charger la liste des agents au chargement
        // Jour courant au format AAAA-MM-JJ (heure locale)
        function aujourdHuiIso() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function montant(valeur) {
            return Math.round(valeur || 0).toLocaleString('fr-FR').replace(/[  ]/g, ' ');
        }

        function heure(iso) {
            return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        // Date locale AAAA-MM-JJ d'un horodatage ISO
        function jourLocal(iso) {
            const d = new Date(iso);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Date locale AAAA-MM-JJ, décalée de n jours en arrière
        function jourIlYA(n) {
            const d = new Date();
            d.setDate(d.getDate() - n);
            return jourLocal(d.toISOString());
        }

        // Dernière activité lisible : connexion, vente, dépense ou suppression
        function libelleActivite(derniere, jour) {
            if (!derniere) return { texte: 'Aucune activité enregistrée', couleur: '#D1D5DB' };
            const quand = new Date(derniere.quand);
            const heureTexte = quand.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const ceJour = jourLocal(derniere.quand) === jour;
            const moment = ceJour ? `aujourd'hui à ${heureTexte}` : `le ${quand.toLocaleDateString('fr-FR')} à ${heureTexte}`;
            const texte = derniere.libelle === 'connexion'
                ? `Dernière connexion ${moment}`
                : `Dernière ${derniere.libelle} ${moment}`;
            return { texte, couleur: ceJour ? '#14B8D9' : '#9CA3AF' };
        }

        // Activité d'un agent : aujourd'hui (compteurs) et dernière activité (sur la période chargée)
        function activiteAgent(prenom, jour, ventes, depenses, suppressions, lastLoginAt) {
            const v = ventes.filter((x) => x.created_by_name === prenom);
            const d = depenses.filter((x) => x.created_by_name === prenom);
            const vJour = v.filter((x) => x.date === jour);
            const dJour = d.filter((x) => x.date === jour);
            const encaisse = vJour.reduce((somme, x) => somme + (parseFloat(x.montant) || 0), 0);
            const decaisse = dJour.reduce((somme, x) => somme + (parseFloat(x.montant) || 0), 0);
            const aJustifierVentes = vJour.filter((x) => !x.justificatif && !x.numeroRecu).length;
            const aJustifierDepenses = dJour.filter((x) => !x.justificatif).length;
            const supp = suppressions === null ? null : suppressions.filter((s) => s.supprimePar && s.supprimePar.nom === prenom);

            const evenements = [
                ...v.filter((x) => x.created_at).map((x) => ({ quand: x.created_at, libelle: 'vente' })),
                ...d.filter((x) => x.created_at).map((x) => ({ quand: x.created_at, libelle: 'dépense' })),
                ...(supp || []).filter((s) => s.date).map((s) => ({ quand: s.date, libelle: 'suppression' })),
                ...(lastLoginAt ? [{ quand: lastLoginAt, libelle: 'connexion' }] : []),
            ];
            const derniere = evenements.sort((a, b) => new Date(b.quand) - new Date(a.quand))[0] || null;

            return {
                ventes: vJour.length,
                encaisse,
                depenses: dJour.length,
                decaisse,
                aJustifierVentes,
                aJustifierDepenses,
                suppressionsMois: supp === null ? null : supp.length,
                statut: libelleActivite(derniere, jour),
            };
        }

        function statistique(libelle, valeur) {
            return `
                                    <div class="rounded-lg bg-gray-100 dark:bg-gray-800 p-3">
                                        <p class="text-xs text-text-light-muted dark:text-gray-400">${libelle}</p>
                                        <p class="mt-1 text-lg font-bold text-text-light dark:text-white">${valeur}</p>
                                    </div>`;
        }

        function carteAgent(agent, activite) {
            const statut = activite.statut.texte;
            const point = activite.statut.couleur;
            return `
                <div class="p-6 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-text-light dark:text-white">${echapperHtml(agent.firstName)}</h3>
                            <p class="mt-1 flex items-center gap-2 text-sm text-text-light-muted dark:text-gray-400"><span class="h-2 w-2 shrink-0 rounded-full" style="background:${point}"></span>${statut}</p>
                            <div class="mt-3 space-y-2">
                                <div class="flex items-center gap-3">
                                    <span class="text-sm text-text-light-muted dark:text-gray-400">Code d'acc&egrave;s :</span>
                                    <code class="bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded font-mono text-sm text-text-light dark:text-white">
                                        ${agent.accessCode}
                                    </code>
                                    <button
                                        type="button"
                                        onclick="navigator.clipboard.writeText('${agent.accessCode}').then(() => alert('Code copi&eacute; !'))"
                                        class="text-primary hover:text-text-light dark:hover:text-white text-sm font-medium transition-colors"
                                    >
                                        <span class="material-symbols-outlined" style="font-size: 18px; vertical-align: middle;">content_copy</span>
                                        Copier
                                    </button>
                                </div>
                                <div class="text-xs text-text-light-muted dark:text-gray-400">
                                    Cr&eacute;&eacute; le : ${new Date(agent.createdAt).toLocaleDateString('fr-FR')}
                                </div>
                                <div class="grid grid-cols-3 gap-2 pt-2">
                                    ${statistique('Ventes du jour', activite.ventes)}
                                    ${statistique('Encaissé', montant(activite.encaisse))}
                                    ${statistique('À justifier', activite.aJustifierVentes)}
                                    ${statistique('Dépenses du jour', activite.depenses)}
                                    ${statistique('Décaissé', montant(activite.decaisse))}
                                    ${statistique('À justifier', activite.aJustifierDepenses)}
                                    <div class="col-span-3">${statistique('Suppressions du mois', activite.suppressionsMois === null ? '—' : activite.suppressionsMois)}</div>
                                </div>
                            </div>
                        </div>
                        <button
                            type="button"
                            onclick="if (confirm('&Ecirc;tes-vous s&ucirc;r de vouloir supprimer cet agent ?')) { deleteAgentHandler('${agent.id}'); }"
                            class="text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 p-2 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors"
                            title="Supprimer l'agent"
                        >
                            <span class="material-symbols-outlined" style="font-size: 24px;">delete</span>
                        </button>
                    </div>
                </div>`;
        }

        // Suppressions du mois en cours (null si indisponible)
        async function chargerSuppressions() {
            const maintenant = new Date();
            const params = new URLSearchParams({ month: maintenant.getMonth() + 1, year: maintenant.getFullYear() });
            try {
                const reponse = await fetch(`${API_BASE_URL}/api/audit/deletions?${params}`, {
                    headers: { Authorization: `Bearer ${getToken()}` }
                });
                if (!reponse.ok) return null;
                const data = await reponse.json();
                return data.history || [];
            } catch (erreur) {
                return null;
            }
        }

        // Charger la liste des agents et leur activité
        async function loadAgents() {
            try {
                const jour = aujourdHuiIso();
                const depuis = jourIlYA(90);
                const [agents, ventes, depenses, suppressions] = await Promise.all([
                    listAgents(),
                    window.OGOUE.getVentesPourPlage(depuis, jour),
                    window.OGOUE.getDepensesPourPlage(depuis, jour),
                    chargerSuppressions(),
                ]);
                displayAgents(agents, jour, ventes || [], depenses || [], suppressions);
            } catch (error) {
                console.error('Erreur chargement agents:', error);
                document.getElementById('agentsList').innerHTML = `
                    <div class="p-8 text-center text-red-600">
                        <p>Erreur lors du chargement des agents</p>
                    </div>
                `;
            }
        }

        // Afficher les agents dans le DOM
        function displayAgents(agents, jour, ventes, depenses, suppressions) {
            const agentsList = document.getElementById('agentsList');

            if (agents.length === 0) {
                agentsList.innerHTML = `
                    <div class="p-8 text-center text-text-light-muted dark:text-gray-400">
                        <p>Aucun agent pour le moment</p>
                    </div>
                `;
                return;
            }

            agentsList.innerHTML = agents
                .map((agent) => carteAgent(agent, activiteAgent(agent.firstName, jour, ventes, depenses, suppressions, agent.lastLoginAt)))
                .join('');
        }

        // Gestionnaire de suppression
        window.deleteAgentHandler = async (agentId) => {
            try {
                await deleteAgent(agentId);
                alert('Agent supprim&eacute; avec succ&egrave;s');
                loadAgents();
            } catch (error) {
                alert('Erreur lors de la suppression');
            }
        };

        // Formulaire de cr&eacute;ation
        document.getElementById('agentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value.trim();
            
            if (!firstName) {
                alert('Veuillez entrer le pr&eacute;nom de l\'agent');
                return;
            }

            try {
                const newAgent = await createAgent(firstName);
                alert(`Agent cr&eacute;&eacute; ! Code d'acc&egrave;s: ${newAgent.accessCode}`);
                document.getElementById('agentForm').reset();
                loadAgents();
            } catch (error) {
                alert('Erreur lors de la cr&eacute;ation de l\'agent');
            }
        });

        // Charger au d&eacute;marrage
        loadAgents();
    </script>
<script>
