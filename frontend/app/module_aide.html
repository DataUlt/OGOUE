<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Aide - OGOUE</title>
    <link rel="icon" type="image/png" href="O-removebg-preview.png">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        /* Palette OGOUE - Redesign */
                        "primary": "#0088CC",
                        "secondary": "#1E3A5F",
                        "background-light": "#f6f8f6",
                        "background-dark": "#111712",
                        "card-light": "#FFFFFF",
                        "card-dark": "#1a2622",
                        "text-light-primary": "#0a0c0a",
                        "text-dark-primary": "#f6f8f6",
                        "text-light-secondary": "#5c6c60",
                        "text-dark-secondary": "#9ca3a8",
                        "border-light": "#e8ede8",
                        "border-dark": "#2a3a32",
                        "success": "#27AE60",
                        "danger": "#E74C3C",
                    },
                    fontFamily: { "display": ["Manrope", "sans-serif"] },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        "soft": "0 8px 20px rgba(29, 226, 46, 0.08)"
                    }
                },
            },
        }
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <!-- Restriction d'acces : un agent est redirige vers ses propres pages -->
    <script src="js/role-guard.js"></script>
    <!-- Les tutoriels sont reserves aux inscrits. Cette page n'appelle
         pas l'API, donc aucun 401 ne renverrait vers la connexion. -->
    <script>
        if (!localStorage.getItem("authToken")) window.location.replace("/login.html");
    </script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-[#0a0c0a] dark:text-gray-200">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">

    <!-- ===== HEADER OGOUE (liens corrigés) ===== -->
    <header class="sticky top-0 z-10 w-full bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm border-b border-[#e8ede8] dark:border-gray-700">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between gap-2 h-20">
                <div class="flex items-center gap-4">
                    <a href="module_tableau_bord"><img src="/app/Logo-ogoue (2).png" alt="OGOUÉ Logo" class="h-28 w-auto"></a>
                </div>
                <div class="hidden md:flex items-center gap-9">
                    <a class="text-[#0a0c0a] dark:text-gray-300 dark:hover:text-white text-sm font-medium leading-normal"
                       href="module_tableau_bord">
                        Tableau de Bord
                    </a>
                    <a class="text-[#0a0c0a] dark:text-gray-300 dark:hover:text-white text-sm font-medium leading-normal"
                       href="module_ventes">
                        Comptabilité
                    </a>
                    <a class="text-[#0a0c0a] dark:text-gray-300 dark:hover:text-white text-sm font-medium leading-normal"
                       href="module_scoring">
                        Financement
                    </a>
                    <a class="text-primary text-sm font-bold leading-normal"
                       href="module_aide.html">
                        Aide
                    </a>
                </div>
                <!-- Menu mobile -->
                <div id="mobile-menu" class="md:hidden absolute top-full left-0 right-0 bg-background-light dark:bg-background-dark border-b border-[#e8ede8] dark:border-gray-700 hidden">
                    <div class="flex flex-col gap-2 p-4">
                        <a class="text-[#0a0c0a] dark:text-gray-300 text-sm font-medium leading-normal py-2 px-3 rounded hover:bg-gray-100 dark:hover:bg-gray-800" href="module_tableau_bord">Tableau de Bord</a>
                        <a class="text-[#0a0c0a] dark:text-gray-300 text-sm font-medium leading-normal py-2 px-3 rounded hover:bg-gray-100 dark:hover:bg-gray-800" href="module_ventes">Comptabilité</a>
                        <a class="text-[#0a0c0a] dark:text-gray-300 text-sm font-medium leading-normal py-2 px-3 rounded hover:bg-gray-100 dark:hover:bg-gray-800" href="module_scoring">Financement</a>
                        <a class="text-primary text-sm font-bold leading-normal py-2 px-3 rounded hover:bg-gray-100 dark:hover:bg-gray-800" href="module_aide.html">Aide</a>
                    </div>
                </div>
                <!-- Bouton menu mobile -->
                <button id="menu-toggle" class="md:hidden flex items-center justify-center w-10 h-10 rounded-full bg-primary/20 text-[#0a0c0a] dark:bg-primary/30 dark:text-white">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="flex items-center gap-2">
                    <button class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-primary/20 text-[#0a0c0a] dark:bg-primary/30 dark:text-white" data-action="settings">
                        <span class="material-symbols-outlined">settings</span>
                    </button>
                    <button class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-primary/20 text-[#0a0c0a] dark:bg-primary/30 dark:text-white"
                         data-action="profile"
                         title="Profil utilisateur">
                        <span class="material-symbols-outlined text-2xl">account_circle</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
    <!-- ===== FIN HEADER ===== -->

    <!-- ===== CONTENU PAGE AIDE ===== -->
    <!-- Les cartes sont generees par js/aide.js, depuis la liste TUTORIELS. -->
    <main class="flex-grow">
        <div class="container mx-auto px-4 py-8">
            <div class="flex flex-col gap-8">

                <header class="flex flex-col gap-1">
                    <h1 class="text-[#0a0c0a] dark:text-white text-3xl md:text-4xl font-black leading-tight tracking-[-0.033em]">
                        Aide
                    </h1>
                    <p class="text-sm text-gray-500 dark:text-gray-400">
                        Des vidéos courtes pour bien utiliser OGOUE, étape par étape.
                    </p>
                </header>

                <div data-aide-grille class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-5xl"></div>

            </div>
        </div>
    </main>

</div>

<script src="js/ogoue-state.js"></script>
<script src="js/header-ui.js"></script>
<script src="js/aide.js"></script>
<script src="js/mobile-menu.js"></script>
<script src="js/topbar-actions.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.OGOUE?.initTopbarActions) {
            window.OGOUE.initTopbarActions();
        }
    });
</script>

</body>
</html>
