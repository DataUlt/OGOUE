<script>
  const FCFA = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
  const STATUTS = {
    brouillon: ["Brouillon", "bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200"],
    depose: ["Déposé", "bg-blue-100 text-blue-800"],
    en_examen: ["En examen", "bg-amber-100 text-amber-800"],
    complement_requis: ["Complément requis", "bg-orange-100 text-orange-800"],
    accepte: ["Accepté", "bg-emerald-100 text-emerald-800"],
    refuse: ["Refusé", "bg-red-100 text-red-800"],
  };

  function echapper(valeur) {
    return String(valeur ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function badge(statut) {
    const [libelle, classes] = STATUTS[statut] || [statut, "bg-gray-100 text-gray-700"];
    return `<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-bold ${classes}">${libelle}</span>`;
  }

  function formatDate(valeur) {
    return valeur ? new Date(valeur).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) : "";
  }

  async function afficherDossiers() {
    const dossiers = await OGOUE.getApplications();
    document.getElementById("listeChargement").classList.add("hidden");

    if (dossiers.length === 0) {
      document.getElementById("listeVide").classList.remove("hidden");
      return;
    }

    document.getElementById("listeDossiers").innerHTML = dossiers.map((dossier) => {
      const produit = dossier.product ? echapper(dossier.product.name) : "Crédit";
      const institution = dossier.institution ? echapper(dossier.institution.name) : "";
      const montant = dossier.amountRequested ? `${FCFA.format(dossier.amountRequested)} FCFA` : "Montant à préciser";
      const date = dossier.submittedAt ? `Déposé le ${formatDate(dossier.submittedAt)}` : `Créé le ${formatDate(dossier.createdAt)}`;
      const lien = dossier.status === "brouillon"
        ? `module_deposer_dossier.html?id=${dossier.id}`
        : `module_dossier.html?id=${dossier.id}`;
      return `
        <a href="${lien}" class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 rounded-2xl bg-white dark:bg-gray-800/40 border border-[#e8ede8] dark:border-gray-700 p-5 hover:shadow-md transition-shadow">
          <div class="min-w-0">
            <p class="font-bold text-base dark:text-gray-100">${produit}</p>
            <p class="text-sm text-gray-500 dark:text-gray-400">${institution}</p>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${montant} · ${date}</p>
          </div>
          <div class="shrink-0 flex items-center gap-2">${badge(dossier.status)}<span data-non-lu="${dossier.id}" class="hidden inline-flex items-center justify-center text-xs font-bold text-white bg-red-500 rounded-full min-w-[22px] h-[22px] px-1.5"></span></div>
        </a>`;
    }).join("");
    const non = await OGOUE.nonLusParDossier().catch(() => ({}));
    document.querySelectorAll("[data-non-lu]").forEach((el) => {
      const n = non[el.dataset.nonLu] || 0;
      if (n) { el.textContent = n; el.classList.remove("hidden"); }
    });
  }

  afficherDossiers();
</script>
