  Intégration : voir LISEZ-MOI.md livré avec les capsules.

<style>
:root{--navy:#0B2A5B;--ink:#0B1F3F;--muted:#4A5568;--blue:#0088CC;--cyan:#14B8D9;--cyanSoft:#E2F6FA;--cyanTxt:#62D7EC;--orange:#F2A04B;--orangeSoft:#FDF0E1;--orangeInk:#A65A0F;--line:#E7EBF0;--field:#CBD3DD;--page:#EEF1F5}

html,body{margin:0;background:transparent;color:var(--ink);font-family:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.ogo{width:100%;max-width:1152px;margin:0 auto}

.txt{align-self:center;display:flex;flex-direction:column;gap:12px}
.k{margin:0;font-size:clamp(12px,1.35vw,15px);font-weight:700;color:var(--cyanTxt);letter-spacing:.04em}
.t{margin:0;font-size:clamp(22px,3.65vw,42px);line-height:1.08;font-weight:800;letter-spacing:-.015em}
.p{margin:0;font-size:clamp(14px,1.65vw,19px);line-height:1.5;color:#DCE6F5;max-width:36ch}
.side{align-self:center;min-width:0}
.in{animation:ogoIn .45s ease both}
.in2{animation:ogoIn2 .5s ease both}
@keyframes ogoIn{from{opacity:0;transform:translateY(10px)}}
@keyframes ogoIn2{from{opacity:0;transform:translateY(16px)}}
@keyframes ogoPulse{0%,100%{box-shadow:0 0 0 3px var(--cyan)}50%{box-shadow:0 0 0 9px rgba(20,184,217,.28)}}
@keyframes ogoBlink{50%{opacity:0}}
.hot{animation:ogoPulse 1.6s ease-in-out infinite}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.15)}
.bar i{display:block;height:100%;width:0;background:var(--cyan)}
.brand{background:#fff;border-radius:14px;padding:clamp(24px,3.8vw,44px) clamp(22px,3.5vw,40px);display:flex;flex-direction:column;gap:14px;box-shadow:0 22px 48px rgba(0,0,0,.35);color:var(--ink)}

.brand .sl{font-size:clamp(13px,1.4vw,16px);color:#33415C}

.mk{background:#fff;color:var(--ink);border-radius:14px;padding:18px 20px;box-shadow:0 22px 48px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;font-size:14px}
.url{display:flex;align-items:center;gap:7px;background:var(--page);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--muted)}
.url i{width:8px;height:8px;border-radius:50%;background:#C3CCD8;display:inline-block}
.url span{margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap}
.nav .wm{font-weight:800;color:var(--navy);font-size:15px;letter-spacing:.02em;margin-right:auto}
.nv{padding:3px 8px;border-radius:6px}
.nv.on{color:var(--navy);font-weight:700;background:var(--cyanSoft)}
.mh{font-size:19px;font-weight:800;line-height:1.2;margin:0}
.ms{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.g1,.g2,.g3{display:grid;gap:10px}
.g1{grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fl{display:flex;flex-direction:column;gap:5px;min-width:0}
.lb{font-size:12px;font-weight:600;color:#33415C}
.fv{min-height:36px;border:1px solid var(--field);border-radius:7px;padding:8px 10px;background:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv.ph{color:#6B778A}
.caret{display:inline-block;width:2px;height:15px;background:var(--blue);margin-left:1px;vertical-align:-2px;animation:ogoBlink .9s step-end infinite}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--field);border-radius:999px;padding:7px 14px;font-size:13px;background:#fff}
.chip.on{background:var(--cyan);border-color:var(--cyan);color:#06243A;font-weight:700}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:13px;background:#fff;min-width:0}
.card.on{border:2px solid var(--cyan);background:var(--cyanSoft);padding:11px}
.card b{font-size:14px}
.card span{color:var(--muted)}
.tag{font-size:10px;font-weight:800;color:var(--orangeInk);background:var(--orangeSoft);border-radius:4px;padding:1px 5px;margin-left:4px}
.kpi{background:#F4F6F9;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi small{font-size:12px;color:var(--muted)}

.rw{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:8px 2px;font-size:13px}

.info.warn{background:var(--orangeSoft);border-color:#F6D9B5}
.info b{font-size:16px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk i{width:16px;height:16px;border-radius:4px;background:var(--blue);display:inline-block;flex:none}
.stp{display:flex;align-items:center}
.sd{width:26px;height:26px;border-radius:50%;border:2px solid #D5D9D5;background:#fff;font-size:12px;font-weight:700;color:#5C6C60;display:flex;align-items:center;justify-content:center;flex:none}
.sd.ok{background:var(--blue);border-color:var(--blue);color:#fff}
.sd.act{background:var(--blue);border-color:var(--navy);color:#fff;box-shadow:0 0 0 3px rgba(0,136,204,.2)}
.sl{flex:1;height:2px;background:#D5D9D5}
.sl.ok{background:var(--blue)}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.qb{display:inline-flex;align-items:center;gap:10px;font-weight:700}
.qb i{font-style:normal;width:24px;height:24px;border-radius:50%;border:1px solid var(--field);display:inline-flex;align-items:center;justify-content:center}
.score{display:flex;align-items:center;gap:16px}
.score b{font-size:40px;font-weight:800;color:var(--navy)}
.score circle.v{transition:stroke-dasharray 1.2s ease .3s}
.chart svg{display:block;width:100%;height:110px}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.cb{font:600 15px 'Geist',system-ui,sans-serif;border:1px solid var(--field);background:#fff;color:var(--ink);border-radius:10px;padding:10px 18px;cursor:pointer;min-height:44px}
.cb.main{background:var(--blue);border-color:var(--blue);color:#fff;min-width:110px}
.cb:hover{border-color:var(--blue)}
.pos{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px}
.dt{width:16px;height:16px;border-radius:50%;border:2px solid #9AA6B8;background:transparent;padding:0;cursor:pointer}
.dt.on{background:var(--blue);border-color:var(--blue)}
.dt.done{background:#9AA6B8}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Tablette : maquette un peu plus compacte */
@media (max-width:960px){.mk{padding:14px;gap:9px;font-size:13px}.mh{font-size:16px}.fv{min-height:32px;padding:6px 8px;font-size:13px}.kpi b{font-size:16px}.score b{font-size:30px}.chart svg{height:80px}}

@media (max-width:700px){.stage{aspect-ratio:auto;grid-template-columns:1fr;padding:24px 18px 30px;gap:20px}.p{max-width:none}.pos{margin-left:0}.dots{width:100%;justify-content:center}.ctrl{justify-content:center}}
/* Petit écran : les cartes côte à côte n'ont plus la place, une par ligne */
@media (max-width:560px){.cards.g3,.cards.g2{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.in,.in2,.hot,.caret{animation:none}.score circle.v{transition:none}}
</style>

    switch (b.k) {
      case 'sitenav': return '<div class="nav"><span class="wm">' + logo(26) + '</span><span>Accueil</span><span>Tarifs</span><span>À propos</span><span class="bt hot">Commencer</span></div>';
      case 'appnav': return '<div class="nav"><span class="wm">' + logo(26) + '</span>' + ['Tableau de Bord', 'Comptabilité', 'Financement'].map((x, j) => '<span class="' + cls('nv', { on: j === b.on || b.hot, hot: b.hot }) + '">' + x + '</span>').join('') + '</div>';
      case 'head': return '<div><p class="mh">' + esc(b.t) + '</p>' + (b.s ? '<p class="ms">' + esc(b.s) + '</p>' : '') + '</div>';
      case 'steps': return '<div style="display:flex;flex-direction:column;gap:8px"><div class="stp">' + [1, 2, 3, 4].map((x) => '<span class="' + cls('sd', { ok: x < b.n, act: x === b.n }) + '">' + x + '</span>' + (x < 4 ? '<span class="' + cls('sl', { ok: x < b.n }) + '"></span>' : '')).join('') + '</div><span class="lb">Étape ' + b.n + ' sur 4 · ' + STEP_NAMES[b.n - 1] + '</span></div>';
      case 'fields': return '<div class="g' + b.items.length + '">' + b.items.map((x) => '<div class="fl"><span class="lb">' + esc(x.l) + '</span><div class="' + cls('fv', { ph: x.ph, hot: x.hot || x.type }) + '"' + (x.type ? ' data-type="' + esc(x.v) + '"' : '') + '>' + (x.type ? '' : esc(x.v)) + '</div></div>').join('') + '</div>';
      case 'chips': return '<div style="display:flex;flex-direction:column;gap:6px">' + (b.label ? '<span class="lb">' + esc(b.label) + '</span>' : '') + '<div class="chips">' + b.items.map((x) => '<span class="' + cls('chip', { on: x.on, hot: x.hot }) + '">' + esc(x.t) + '</span>').join('') + '</div></div>';
      case 'cards': return '<div class="cards g' + Math.min(3, b.items.length) + '">' + b.items.map((x) => '<div class="' + cls('card', { on: x.on, hot: x.hot }) + '"><b>' + esc(x.t) + (x.tag ? '<span class="tag">' + esc(x.tag) + '</span>' : '') + '</b>' + (x.s ? '<span>' + esc(x.s) + '</span>' : '') + '</div>').join('') + '</div>';
      case 'kpis': return '<div class="g3">' + b.items.map((x) => '<div class="' + cls('kpi', { dark: x[2] }) + '"><small>' + esc(x[0]) + '</small><b>' + esc(x[1]) + '</b></div>').join('') + '</div>';
      case 'rows': return '<div class="rows">' + b.items.map((x) => '<div class="' + cls('rw', { hl: x[2] }) + '"><span>' + esc(x[0]) + '</span><strong>' + esc(x[1]) + '</strong></div>').join('') + '</div>';
      case 'btns': return '<div class="btns">' + b.items.map((x) => '<span class="' + cls('bt', { [x.v || '_']: !!x.v, full: x.full, hot: x.hot }) + '">' + esc(x.t) + '</span>').join('') + '</div>';
      case 'note': return '<p class="note">' + esc(b.t) + '</p>';
      case 'next': return '<div class="next"><span>À suivre</span>' + esc(b.t) + '</div>';
      case 'info': return '<div class="' + cls('info', { warn: b.warn }) + '"><b>' + esc(b.t) + '</b><span class="ms">' + esc(b.s) + '</span></div>';
      case 'check': return '<div class="chk"><i></i>' + esc(b.t) + '</div>';
      case 'qty': return '<div class="qty"><span>' + esc(b.n) + '</span><span class="qb"><i>−</i>' + esc(b.q) + '<i>+</i></span><strong>' + esc(b.tot) + '</strong></div>';
      case 'score': return '<div class="score"><svg width="86" height="86" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="#E7EBF0" stroke-width="4"/><circle class="v" cx="18" cy="18" r="15" fill="none" stroke="#14B8D9" stroke-width="4" stroke-dasharray="0 94.2" data-dash="' + (b.pct * 0.942).toFixed(1) + ' 94.2" transform="rotate(-90 18 18)" stroke-linecap="round"/></svg><div style="display:flex;flex-direction:column"><b>' + esc(b.v) + '</b><span class="ms">Score de traçabilité</span></div></div>';
      case 'chart': return '<div class="chart" style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;gap:14px;font-size:12px;font-weight:700"><span style="color:#007C96">● Entré</span><span style="color:#A65A0F">● Sorti</span></div><svg viewBox="0 0 300 110" preserveAspectRatio="none" aria-hidden="true"><path d="M0 92 L50 80 L100 70 L150 52 L200 44 L250 28 L300 20" fill="none" stroke="#14B8D9" stroke-width="3"/><path d="M0 100 L50 96 L100 90 L150 86 L200 80 L250 74 L300 70" fill="none" stroke="#F2A04B" stroke-width="3"/><path d="M250 28 L250 74" stroke="#0B2A5B" stroke-width="1.5" stroke-dasharray="4 3"/></svg><span class="ms">L\'écart entre les deux courbes, c\'est ce qui vous reste.</span></div>';
    }
    return '';
  }

  function render() {
    const s = S[i];
    txt.innerHTML = '<div class="in" style="display:flex;flex-direction:column;gap:12px"><p class="k">' + esc(s.k) + '</p><h2 class="t">' + esc(s.t) + '</h2><p class="p">' + esc(s.p) + '</p></div>';
    if (s.brand) {
      side.innerHTML = '<div class="brand in2"><div class="wm">' + logo(64) + '</div><span class="sl">Bien gérer aujourd\'hui pour mieux préparer son développement demain.</span><span class="cp">' + esc(S[0].k) + '</span></div>';
    } else {
      side.innerHTML = '<div class="mk in2"><div class="url"><i></i><i></i><i></i><span>' + esc(s.url) + '</span></div>' + (s.m || []).map(block).join('') + '</div>';
    }
    typed = [...side.querySelectorAll('[data-type]')];
    if (reduit) typed.forEach((el) => { el.textContent = el.dataset.type; });
    const sc = side.querySelector('circle.v');
    if (sc) requestAnimationFrame(() => requestAnimationFrame(() => sc.setAttribute('stroke-dasharray', sc.dataset.dash)));
    [...dots.children].forEach((b, n) => { b.className = cls('dt', { on: n === i, done: n < i }); b.setAttribute('aria-current', n === i ? 'step' : 'false'); });
    pos.textContent = 'Plan ' + (i + 1) + ' / ' + S.length;
    update();
  }

  function update() {
    prog.style.width = Math.min(100, (t / dur(S[i])) * 100) + '%';
    if (!reduit) typed.forEach((el) => {
      const full = el.dataset.type, c = Math.max(0, Math.floor((t - FRAPPE_DEBUT) / FRAPPE_MS));
      el.textContent = full.slice(0, c);
      if (c < full.length) { const k = document.createElement('span'); k.className = 'caret'; el.appendChild(k); }
      else el.classList.remove('hot');
    });
    play.textContent = playing ? 'Pause' : (ended ? 'Revoir' : 'Lecture');
  }

  function go(n) { i = (n + S.length) % S.length; t = 0; ended = false; render(); }

  function frame(now) {
    const dt = last ? Math.min(100, now - last) : 0; last = now;
    if (playing && visible) {
      t += dt * VITESSE;
      if (t >= dur(S[i])) {
        if (i < S.length - 1) go(i + 1);
        else { t = dur(S[i]); playing = false; ended = true; update(); }
      } else update();
    }
    requestAnimationFrame(frame);
  }

  S.forEach((_, n) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'dt'; b.setAttribute('aria-label', 'Aller au plan ' + (n + 1)); b.onclick = () => go(n); dots.appendChild(b); });
  $('prev').onclick = () => go(i - 1);
  $('next').onclick = () => go(i + 1);
  play.onclick = () => {
    if (playing) playing = false;
    else if (ended) { playing = true; go(0); }
    else playing = true;
    update();
  };
  $('ogo').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(i + 1);
    if (e.key === 'ArrowLeft') go(i - 1);
  });

  /* Démarre seulement quand la capsule est visible à l'écran (et pas si l'utilisateur a demandé moins d'animations). */
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((es) => {
      visible = es[0].isIntersecting;
      if (visible && !started) { started = true; playing = !reduit; update(); }
    }, { threshold: 0.4 }).observe($('stage'));
  } else { visible = true; started = true; playing = !reduit; }

  /* Hauteur pour l'iframe parente (voir LISEZ-MOI.md) */
  const envoyerHauteur = () => { if (window.parent !== window) window.parent.postMessage({ ogoueCapsule: NUM, hauteur: document.documentElement.scrollHeight }, '*'); };
  if ('ResizeObserver' in window) new ResizeObserver(envoyerHauteur).observe(document.body);
  window.addEventListener('load', envoyerHauteur);

  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
